# P572 (20 Haz 2026 deploy): pnpm 11 build-script onayı (ERR_PNPM_IGNORED_BUILDS fix).
# pnpm 10.15+/11 'onlyBuiltDependencies' ayarını package.json yerine BURADAN okur.
# sharp = Next image optimization (runtime); msw/unrs-resolver = build script onayı.
# P575: pnpm 11 workspace dosyası 'packages' alanı zorunlu (tek-paket repo → kök).
packages:
  - "."
