# Quanfina Next.js — Cloud Run deploy pipeline (P572, 20 Haz 2026).
# Context = web/ (self-contained). API_URL build-arg (rewrites build-time gomulur).
# Erisim: --allow-unauthenticated (browser erisimi; uygulama-ici gate P575 cerez-tabanli
# oturum — /login parola + Cikis butonu. APP_PASSWORD login dogrular, SESSION_TOKEN cerez).
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-web
    args:
      - build
      - -f
      - web/Dockerfile
      - --build-arg
      - "API_URL=${_API_URL}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/web:${_TAG}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/web:latest"
      - web

  - name: "gcr.io/cloud-builders/docker"
    id: push-web
    waitFor: [build-web]
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/web"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-web
    waitFor: [push-web]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - quanfina-web
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/web:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=API_URL=${_API_URL}
      - --set-secrets=APP_PASSWORD=APP_PASSWORD:latest,SESSION_TOKEN=SESSION_TOKEN:latest
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=120
      - --concurrency=80

substitutions:
  _REGION: europe-west1
  _TAG: latest
  _API_URL: "https://quanfina-api-amhdfx6mta-ew.a.run.app"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/web:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
