# Quanfina FastAPI — Cloud Run deploy pipeline (P572, 20 Haz 2026).
# Scanner pattern mirror (cloudbuild.yaml): build (api/Dockerfile, context koku) -> push -> deploy.
# DB: Cloud SQL connector quanfina:us-central1:quanfina-db + Secret Manager PG_* (scanner birebir).
# Erisim: --allow-unauthenticated (public — Sn. Ferit karari, dusuk-hassasiyet kagit/piyasa verisi).
steps:
  - name: "gcr.io/cloud-builders/docker"
    id: build-api
    args:
      - build
      - -f
      - api/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/api:${_TAG}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/api:latest"
      - .

  - name: "gcr.io/cloud-builders/docker"
    id: push-api
    waitFor: [build-api]
    args: [push, "--all-tags", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/api"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-api
    waitFor: [push-api]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - quanfina-api
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/api:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=quanfina:us-central1:quanfina-db
      - --set-secrets=PG_HOST=PG_HOST:latest,PG_PORT=PG_PORT:latest,PG_DATABASE=PG_DATABASE:latest,PG_USER=PG_USER:latest,PG_PASSWORD=PG_PASSWORD:latest
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=120
      - --concurrency=40

substitutions:
  _REGION: europe-west1
  _TAG: latest

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/api:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
