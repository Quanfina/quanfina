steps:
  # --- Scanner image ---
  # KARAR #486 (alt-paket P176, 26 May 2026): Streamlit (quanfina-app) emekli.
  # Sadece scanner build/deploy aktif. Next.js (web/) ve FastAPI (api/) ayrı pipeline
  # bekliyor (Aşama 4+ Cloud Run deploy). Streamlit kaynak _archive/streamlit_legacy/'de.
  - name: "gcr.io/cloud-builders/docker"
    id: build-scanner
    args:
      - build
      - -f
      - Dockerfile.scanner
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/scanner:${_TAG}"
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/scanner:latest"
      - .

  - name: "gcr.io/cloud-builders/docker"
    id: push-scanner
    waitFor: [build-scanner]
    args:
      - push
      - --all-tags
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/scanner"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-scanner
    waitFor: [push-scanner]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - quanfina-scanner
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/scanner:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --timeout=3600
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=1
      - --set-secrets=PG_HOST=PG_HOST:latest,PG_PORT=PG_PORT:latest,PG_DATABASE=PG_DATABASE:latest,PG_USER=PG_USER:latest,PG_PASSWORD=PG_PASSWORD:latest,FINVIZ_API_KEY=FINVIZ_API_KEY:latest

substitutions:
  _REGION: europe-west1
  _TAG: latest

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/quanfina/scanner:${_TAG}"

options:
  logging: CLOUD_LOGGING_ONLY
